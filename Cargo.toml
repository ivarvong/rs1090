[workspace]
resolver = "2"
members = ["crates/rs1090", "crates/rs1090-cli", "crates/rs1090-serve"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ivarvong/rs1090"
authors = ["Ivar Vong <ivar@ivarvong.com>"]

[workspace.dependencies]
rs1090 = { path = "crates/rs1090", version = "0.1.0" }

anyhow = "1"
arrayvec = { version = "0.7", default-features = false }
# Fast, non-cryptographic hasher used for in-process maps keyed by
# tightly-distributed integers (ICAO addresses). About 5× faster than
# SipHash and never seeded — we don't need DoS resistance for keys we
# generate ourselves from the radio.
rustc-hash = "2"
# Doubly-linked HashMap that preserves insertion order and supports
# O(1) move-to-back / pop-front. Used for the LRU aircraft table so
# touch, eviction, and active-set scans are all O(1) or O(k).
hashlink = "0.9"
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = { version = "0.5", default-features = false }
rs-rtl = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.7"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
# Persistent config for `rs1090-serve` (`/etc/rs1090/serve.toml`).
# `parse`-only: we read these files but never write them, so we don't
# need the serialization half of the crate.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# Pi-friendly profile. Release-like, with two concessions to the Pi
# Zero 2 W's 416 MB RAM:
#
# - **LTO off** (`lto = false`). The workspace `release` profile's
#   thin-LTO link step peaks rustc at ~700 MB, which OOMs the Pi.
# - **`codegen-units = 16`** (the rustc default), overriding the
#   `release` profile's `= 1`. With one codegen unit, rustc has to
#   hold the entire crate's IR in memory at once; for heavy deps
#   (`bluer` was the OOM trigger when building with `--features ble`)
#   this is enough to push past 700 MB and trip the kernel OOM-killer
#   even with 415 MB of swap available. Chunked codegen keeps peak
#   RSS in a band the Pi can actually service.
#
# Runtime cost vs. `release`: marginal — typically a couple of percent
# on hot-path code, none of which is BLE-related.
#
#   cargo build --profile pi -p rs1090-serve --features ble
[profile.pi]
inherits = "release"
lto = false
codegen-units = 16

[profile.bench]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
