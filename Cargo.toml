[workspace]
resolver = "2"
members = ["crates/rs1090", "crates/rs1090-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ivarvong/rs1090"
authors = ["Ivar Vong <ivar@ivarvong.com>"]

[workspace.dependencies]
rs1090 = { path = "crates/rs1090", version = "0.1.0-dev" }

anyhow = "1"
arrayvec = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = { version = "0.5", default-features = false }
rs-rtl = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
axum = "0.7"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.bench]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
