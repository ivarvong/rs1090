[package]
name = "rs1090"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Mode S / ADS-B decoder. Library-first, real-time on Raspberry Pi Zero W."
readme = "../../README.md"
keywords = ["ads-b", "mode-s", "sdr", "aviation", "dsp"]
categories = ["aerospace", "science", "no-std"]

[features]
default = ["std"]
std = []
# Synthetic frame generation, only useful for tests and demos.
test-utils = ["std"]
# RTL-SDR live SampleSource. Pulls in rs-rtl + nusb.
rtl-sdr = ["std", "dep:rs-rtl"]

[dependencies]
arrayvec = { workspace = true }
hashlink = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true, optional = true }
rs-rtl = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }

[[bench]]
name = "magnitude"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic noise we don't care about:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"

[[bench]]
name = "crc"
harness = false

[[bench]]
name = "decode"
harness = false
required-features = ["test-utils"]
