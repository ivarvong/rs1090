[package]
name = "rs1090-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line tool for the rs1090 Mode S / ADS-B decoder."
# Deployment artifact, not a library other crates depend on. Skip
# crates.io for v0.1; revisit once `live --record` and friends stabilize.
publish = false

[[bin]]
name = "rs1090"
path = "src/main.rs"

[features]
default = ["rtl-sdr"]
# Enable the live RTL-SDR backend (pulls in rs-rtl + nusb).
rtl-sdr = ["rs1090/rtl-sdr", "dep:ctrlc"]

[dependencies]
rs1090 = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { version = "3", optional = true }

[dev-dependencies]
# Re-enable the same crate with the `test-utils` feature so integration
# tests can synthesize known frames without depending on captured `.iq`
# files in-tree.
rs1090 = { workspace = true, features = ["test-utils"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
