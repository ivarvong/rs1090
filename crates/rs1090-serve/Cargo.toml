[package]
name = "rs1090-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP/SSE server for the rs1090 Mode S / ADS-B decoder."
# Deployment artifact with optional system-level deps (libdbus for the
# BLE feature). Not a library, not on crates.io.
publish = false

[[bin]]
name = "rs1090-serve"
path = "src/main.rs"

[features]
default = ["rtl-sdr"]
rtl-sdr = ["rs1090/rtl-sdr"]
# Linux-only: spin up a BLE GATT peripheral via BlueZ so iPhone / Android
# debug apps (nRF Connect, LightBlue) can subscribe to live aircraft
# summaries over Bluetooth. Pulls in `bluer`, which talks D-Bus and
# requires libdbus on the target.
ble = ["dep:bluer"]

[dependencies]
rs1090 = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }

[dev-dependencies]
rs1090 = { workspace = true, features = ["test-utils"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
