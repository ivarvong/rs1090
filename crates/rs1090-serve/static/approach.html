<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>approach watch — rs1090</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <style>
    html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #e6e8eb; }
    #app { display: grid; grid-template-columns: 360px 1fr; height: 100%; background: #0e1014; }
    #panel { overflow-y: auto; border-right: 1px solid #1f2329; padding: 14px 14px 24px; }
    #map { background: #1a1c20; }
    #panel h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
    #panel .sub { color: #8b939c; font-size: 11px; margin-bottom: 10px; }

    .stat-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11px; margin-bottom: 16px; }
    .stat-grid .k { color: #8b939c; }
    .stat-grid .v { color: #e6e8eb; font-variant-numeric: tabular-nums; }

    #status { font-size: 11px; margin: 4px 0 12px; }
    #status.ok::before    { content: "● "; color: #4ade80; }
    #status.bad::before   { content: "● "; color: #f87171; }
    #status.wait::before  { content: "● "; color: #fbbf24; }

    #runway { font-size: 11px; padding: 6px 8px; background: rgba(96,165,250,0.08); border: 1px solid rgba(96,165,250,0.3); border-radius: 4px; margin-bottom: 14px; }
    #runway b { color: #a5b4fc; font-size: 13px; }

    .vec-ctrl { margin-bottom: 14px; }
    .vec-ctrl .row { display: flex; align-items: baseline; justify-content: space-between; font-size: 11px; color: #8b939c; margin-bottom: 4px; }
    .vec-ctrl .row b { color: #e6e8eb; font-size: 12px; font-variant-numeric: tabular-nums; }
    .vec-ctrl input[type=range] { width: 100%; accent-color: #4ade80; background: transparent; }
    .vec-ctrl .hint { font-size: 10px; color: #6b7280; }

    #aircraft-title { margin: 0 0 4px; font-size: 11px; color: #8b939c; text-transform: uppercase; letter-spacing: 0.06em; }
    #aircraft { list-style: none; margin: 0; padding: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    #aircraft li { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    #aircraft li:hover { background: rgba(255,255,255,0.03); }
    #aircraft .row1 { display: flex; justify-content: space-between; align-items: baseline; }
    #aircraft .callsign { color: #a5b4fc; font-weight: 600; font-size: 13px; }
    #aircraft .icao { color: #8b939c; font-size: 10px; }
    #aircraft .approach-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.4); }
    #aircraft .approach-tag.unknown { background: transparent; color: #8b939c; border-color: rgba(139,147,156,0.3); }
    #aircraft .row2 { color: #d4d6da; margin-top: 3px; font-size: 11px; }
    #aircraft .dim { color: #8b939c; }

    /* Plane markers. */
    .plane { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; transition: transform 200ms linear; }
    .plane svg { width: 24px; height: 24px; filter: drop-shadow(0 0 2px rgba(0,0,0,0.6)); }
    .plane .body { fill: #60a5fa; stroke: #0b1120; stroke-width: 1.2; }
    .plane.approach .body { fill: #4ade80; }
    .plane.stale .body { fill: #6b7280; }
    .plane .label { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); color: #e6e8eb; font-size: 10px; font-weight: 600; background: rgba(20,22,26,0.85); padding: 1px 5px; border-radius: 3px; white-space: nowrap; pointer-events: none; }

    /* User / airport pins. */
    .pin { position: relative; font-size: 16px; line-height: 1; transform: translate(-50%, -100%); }
    .pin .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.5); }
    .pin .label { position: absolute; left: 18px; top: -2px; white-space: nowrap; font-size: 10px; font-weight: 600; background: rgba(20,22,26,0.85); padding: 1px 5px; border-radius: 3px; }
    .pin.user .dot { background: #fbbf24; }
    .pin.airport .dot { background: #a5b4fc; }

    #error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.4); color: #fca5a5; padding: 12px; border-radius: 4px; margin: 12px; font-size: 12px; line-height: 1.5; }
    #error b { color: #fecaca; }
    #error code { background: rgba(0,0,0,0.3); padding: 0 4px; border-radius: 2px; }

    .leaflet-popup-content-wrapper { background: #14161a; color: #e6e8eb; }
    .leaflet-popup-content { font-size: 12px; margin: 10px 12px; }
    .leaflet-popup-tip { background: #14161a; }
    .leaflet-popup-content b { color: #a5b4fc; }
    .leaflet-popup-content td { padding: 1px 4px; }
    .leaflet-popup-content td:first-child { color: #8b939c; }
    .leaflet-control-attribution { background: rgba(20,22,26,0.7) !important; color: #8b939c !important; }
    .leaflet-control-attribution a { color: #a5b4fc !important; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="panel">
      <h1 id="title">approach watch</h1>
      <div class="sub" id="subtitle">aircraft on final, visible from you</div>
      <div id="status" class="wait">connecting…</div>

      <div class="stat-grid">
        <span class="k">you</span><span class="v" id="you">—</span>
        <span class="k" id="airport-label">airport</span><span class="v" id="airport-stats">—</span>
        <span class="k">tracked</span><span class="v" id="tracked">0</span>
        <span class="k">low + near</span><span class="v" id="low-near">0</span>
        <span class="k">on approach</span><span class="v" id="approach-count">0</span>
      </div>

      <div id="runway">active runway guess: <b id="runway-guess">—</b></div>

      <div class="vec-ctrl">
        <div class="row">
          <span>projection vector</span>
          <b><span id="vec-value">60</span>s</b>
        </div>
        <input type="range" id="vec-slider" min="0" max="180" step="15" value="60">
        <div class="hint">where each aircraft will be at current track + speed; 0 disables</div>
      </div>

      <h2 id="aircraft-title">aircraft (closest first)</h2>
      <ul id="aircraft"></ul>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
  "use strict";

  // --- Configuration ----------------------------------------------------------

  // Builtin airport table. Each entry needs:
  //   ref   : [lat, lon] of the airport reference point
  //   runways: array of { runway, course } where `course` is the true
  //            heading (in degrees) an aircraft must be flying to be on
  //            final to that runway. NYC declination is ~-13°, so a
  //            magnetic 220° becomes true 207°.
  //   bbox  : SSE subscription bounding box, hand-tuned to cover the
  //           airport plus a useful chunk of approach corridor.
  // Adding a new airport is one entry — clone-and-edit.
  const AIRPORTS = {
    lga: {
      name: "LGA",
      icao: "KLGA",
      ref: [40.7769, -73.8740],
      runways: [
        { runway: "04", course: 27 },
        { runway: "22", course: 207 },
        { runway: "13", course: 117 },
        { runway: "31", course: 297 },
      ],
      bbox: "40.55,-74.15,40.95,-73.65",
    },
    jfk: {
      name: "JFK",
      icao: "KJFK",
      ref: [40.6413, -73.7781],
      runways: [
        { runway: "04L/R", course: 31 },
        { runway: "22L/R", course: 211 },
        { runway: "13L/R", course: 121 },
        { runway: "31L/R", course: 301 },
      ],
      bbox: "40.45,-74.00,40.85,-73.45",
    },
    ewr: {
      name: "EWR",
      icao: "KEWR",
      ref: [40.6925, -74.1687],
      runways: [
        { runway: "04L/R", course: 27 },
        { runway: "22L/R", course: 207 },
        { runway: "11", course: 97 },
        { runway: "29", course: 277 },
      ],
      bbox: "40.50,-74.40,40.90,-73.95",
    },
  };

  const params = new URLSearchParams(location.search);

  // Parse `?runways=04:27,22:207`. Each pair is `name:course`.
  function parseRunways(s) {
    if (!s) return null;
    const out = [];
    for (const tok of s.split(",")) {
      const [name, course] = tok.split(":");
      const c = Number(course);
      if (!name || !Number.isFinite(c)) return null;
      out.push({ runway: name.trim(), course: c });
    }
    return out.length ? out : null;
  }

  // Resolve the airport config from URL params, with three forms:
  //   ?airport=lga                 — look up in the builtin table.
  //   ?ref=LAT,LON&runways=N:C,…   — fully custom (also accepts &bbox=…
  //                                  and &name=…).
  //   (nothing)                    — surface a help message.
  function resolveAirport() {
    const tag = (params.get("airport") || "").toLowerCase();
    if (tag && AIRPORTS[tag]) return AIRPORTS[tag];

    const refStr = params.get("ref");
    const runwaysStr = params.get("runways");
    if (refStr && runwaysStr) {
      const ref = refStr.split(",").map(Number);
      const runways = parseRunways(runwaysStr);
      if (ref.length === 2 && ref.every(Number.isFinite) && runways) {
        // Default bbox is ±0.2° around ref — about a 12 nm × 15 nm box
        // at NYC latitudes.
        const bbox = params.get("bbox") || [
          (ref[0] - 0.2).toFixed(3),
          (ref[1] - 0.25).toFixed(3),
          (ref[0] + 0.2).toFixed(3),
          (ref[1] + 0.25).toFixed(3),
        ].join(",");
        return {
          name: params.get("name") || "custom",
          icao: params.get("icao") || "",
          ref,
          runways,
          bbox,
        };
      }
    }
    return null;
  }

  const AIRPORT = resolveAirport();
  if (!AIRPORT) {
    document.getElementById("app").innerHTML = `
      <div id="error" style="margin:24px;max-width:600px">
        <b>missing airport</b><br><br>
        Pick one of the builtin airports:
        <code>?airport=lga</code>, <code>?airport=jfk</code>, <code>?airport=ewr</code>
        <br><br>
        Or pass a custom one:
        <code>?ref=LAT,LON&amp;runways=NAME:TRUE_COURSE,…</code>
        <br><br>
        Examples:
        <pre>
?airport=lga
?airport=lga&amp;me=40.78,-73.96
?ref=40.69,-74.17&amp;runways=04:27,22:207,11:97,29:277&amp;name=EWR
        </pre>
      </div>`;
    throw new Error("no airport configured");
  }

  // User location: ?me=lat,lon. Defaults to the airport reference so the
  // page is always usable, even without a viewpoint — the user just sees
  // approach traffic from the runway's perspective.
  const meStr = params.get("me");
  const ME = meStr && meStr.split(",").length === 2
    ? meStr.split(",").map(Number)
    : AIRPORT.ref.slice();

  const AIRPORT_REF = AIRPORT.ref;
  const APPROACH_COURSES_TRUE = AIRPORT.runways;

  // Distance limits.
  const MAX_RANGE_NM = 15;     // beyond this we ignore even with low alt
  const MAX_APPROACH_ALT = 6000;
  const APPROACH_HEADING_TOL = 25; // deg

  // Radar-style projected-position vector. Reads `?vec=N` (seconds);
  // 0 disables, >0 draws a line ahead of each aircraft showing where
  // it will be at its current track + ground speed. The slider in the
  // panel re-binds this live.
  let VECTOR_SECONDS = (() => {
    const v = parseInt(params.get("vec") || "60", 10);
    return Number.isFinite(v) && v >= 0 && v <= 600 ? v : 60;
  })();
  // Tick interval in seconds — produces a dashed look that doubles as
  // time markers. With ticks every 15s a 60s vector shows four pulses.
  const VECTOR_TICK_S = 15;

  // Reflect the chosen airport in the page chrome.
  document.title = `${AIRPORT.name} approach watch — rs1090`;
  document.getElementById("title").textContent = `${AIRPORT.name} approach watch`;
  document.getElementById("subtitle").textContent =
    `aircraft on final${AIRPORT.icao ? ` to ${AIRPORT.icao}` : ""}, visible from you`;
  document.getElementById("airport-label").textContent = AIRPORT.name;

  // --- Geo math ---------------------------------------------------------------

  const EARTH_R_NM = 3440.065;

  function toRad(deg) { return (deg * Math.PI) / 180; }
  function toDeg(rad) { return (rad * 180) / Math.PI; }

  function haversineNm(a, b) {
    const [lat1, lon1] = a, [lat2, lon2] = b;
    const φ1 = toRad(lat1), φ2 = toRad(lat2);
    const dφ = toRad(lat2 - lat1), dλ = toRad(lon2 - lon1);
    const x = Math.sin(dφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ/2)**2;
    return 2 * EARTH_R_NM * Math.asin(Math.sqrt(x));
  }

  function bearingDeg(from, to) {
    const [lat1, lon1] = from, [lat2, lon2] = to;
    const φ1 = toRad(lat1), φ2 = toRad(lat2);
    const dλ = toRad(lon2 - lon1);
    const y = Math.sin(dλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(dλ);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function compass(deg) {
    const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return dirs[Math.round(deg / 22.5) % 16];
  }

  function angularDistance(a, b) {
    let d = Math.abs(a - b) % 360;
    return d > 180 ? 360 - d : d;
  }

  // Great-circle destination from a starting point given an initial
  // bearing (degrees true) and a distance (meters). At the speeds and
  // 1-minute horizons we care about the great-circle and a flat-earth
  // tangent agree to fractions of a metre; the great-circle is the
  // structurally honest form.
  const EARTH_R_M = 6_371_000;
  function projectGc(start, bearingDeg, distMeters) {
    const d = distMeters / EARTH_R_M;
    const θ = toRad(bearingDeg);
    const φ1 = toRad(start[0]);
    const λ1 = toRad(start[1]);
    const sinφ2 = Math.sin(φ1) * Math.cos(d) + Math.cos(φ1) * Math.sin(d) * Math.cos(θ);
    const φ2 = Math.asin(sinφ2);
    const λ2 = λ1 + Math.atan2(
      Math.sin(θ) * Math.sin(d) * Math.cos(φ1),
      Math.cos(d) - Math.sin(φ1) * sinφ2,
    );
    return [toDeg(φ2), toDeg(λ2)];
  }

  // --- Approach classifier ---------------------------------------------------

  // Given an aircraft's track, return the matching runway (or null).
  function approachRunway(track) {
    if (!Number.isFinite(track)) return null;
    let best = null;
    for (const r of APPROACH_COURSES_TRUE) {
      const d = angularDistance(track, r.course);
      if (d <= APPROACH_HEADING_TOL && (!best || d < best.d)) {
        best = { runway: r.runway, d };
      }
    }
    return best ? best.runway : null;
  }

  function isOnApproach(a) {
    if (!Number.isFinite(a.distApt) || a.distApt > MAX_RANGE_NM) return false;
    if (a.alt_ft == null || a.alt_ft > MAX_APPROACH_ALT) return false;
    if (approachRunway(a.track) === null) return false;
    // Reject climbing aircraft — track direction alone can't separate
    // an arrival on runway N from a departure on runway N (same
    // course). Require descent at >300 fpm, or, if vertical rate is
    // unavailable, require the aircraft to be at typical
    // intermediate-approach altitude (below 3000 ft AGL).
    if (a.vr_mps != null) {
      const fpm = a.vr_mps * 196.85;
      if (fpm > -300) return false;
    } else if (a.alt_ft > 3000) {
      return false;
    }
    return true;
  }

  // --- Map setup --------------------------------------------------------------

  const map = L.map("map", { zoomControl: true, attributionControl: true })
    .setView(AIRPORT_REF, 11);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    subdomains: "abcd",
    maxZoom: 19,
  }).addTo(map);

  // Pins for user + airport.
  function pinIcon(cls, label) {
    return L.divIcon({
      className: "",
      html: `<div class="pin ${cls}"><div class="dot"></div><div class="label">${label}</div></div>`,
      iconSize: [14, 14],
      iconAnchor: [7, 14],
    });
  }
  L.marker(ME, { icon: pinIcon("user", "you") }).addTo(map);
  L.marker(AIRPORT_REF, { icon: pinIcon("airport", AIRPORT.name) }).addTo(map);
  L.polyline([ME, AIRPORT_REF], { color: "#fbbf24", weight: 1.5, opacity: 0.4, dashArray: "4 5" }).addTo(map);

  // Fit view to include user + airport, with margin.
  map.fitBounds(L.latLngBounds([ME, AIRPORT_REF]), { padding: [60, 60] });

  // --- Aircraft state --------------------------------------------------------

  const aircraft = new Map();

  function planeIconHtml(callsign, track, isApproach, isStale) {
    const rot = Number.isFinite(track) ? track : 0;
    const cls = ["plane"];
    if (isApproach) cls.push("approach");
    if (isStale) cls.push("stale");
    const label = callsign ? `<div class="label">${escapeHtml(callsign)}</div>` : "";
    return `<div class="${cls.join(" ")}" style="transform: rotate(${rot}deg);">
      <svg viewBox="-12 -12 24 24"><path class="body" d="M0,-10 L7,8 L0,4 L-7,8 Z"/></svg>
      ${label}
    </div>`;
  }

  function makeIcon(callsign, track, isApproach, isStale) {
    return L.divIcon({
      className: "",
      html: planeIconHtml(callsign, track, isApproach, isStale),
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function ensureAircraft(icao) {
    let a = aircraft.get(icao);
    if (!a) {
      a = { icao, marker: null, vector: null, callsign: null, lat: null, lon: null,
            alt_ft: null, alt_source: null, track: null, gs_mps: null, vr_mps: null,
            lastUpdate: Date.now() };
      aircraft.set(icao, a);
    }
    return a;
  }

  // Compute a polyline path representing where the aircraft will be over
  // the next `VECTOR_SECONDS`, with a tick segment every `VECTOR_TICK_S`
  // seconds. Returns `null` if we can't draw a meaningful vector — no
  // position, no track, no ground speed, or vector disabled.
  function vectorPath(a) {
    if (VECTOR_SECONDS <= 0) return null;
    if (!Number.isFinite(a.lat) || !Number.isFinite(a.lon)) return null;
    if (!Number.isFinite(a.track) || !Number.isFinite(a.gs_mps) || a.gs_mps <= 0) return null;
    const pts = [[a.lat, a.lon]];
    const stepS = Math.min(VECTOR_TICK_S, VECTOR_SECONDS);
    let t = stepS;
    while (t <= VECTOR_SECONDS + 1e-9) {
      pts.push(projectGc([a.lat, a.lon], a.track, a.gs_mps * t));
      t += stepS;
    }
    if (pts.length < 2) return null;
    return pts;
  }

  function refreshVector(a) {
    const pts = vectorPath(a);
    if (!pts) {
      if (a.vector) { map.removeLayer(a.vector); a.vector = null; }
      return;
    }
    const stale = (Date.now() - a.lastUpdate) > 30_000;
    const color = stale ? "#6b7280" : (a.onApproach ? "#4ade80" : "#60a5fa");
    if (!a.vector) {
      // dashArray "5 3" creates the per-tick break naturally — combined
      // with the explicit polyline-point density per VECTOR_TICK_S we get
      // a clear cadence that reads as time-along-the-vector.
      a.vector = L.polyline(pts, { color, weight: 1.4, opacity: 0.55, dashArray: "5 3" }).addTo(map);
    } else {
      a.vector.setLatLngs(pts);
      a.vector.setStyle({ color });
    }
  }

  function recompute(a) {
    if (Number.isFinite(a.lat) && Number.isFinite(a.lon)) {
      a.distApt = haversineNm([a.lat, a.lon], AIRPORT_REF);
      a.distMe = haversineNm([a.lat, a.lon], ME);
      a.bearingFromMe = bearingDeg(ME, [a.lat, a.lon]);
      a.compassFromMe = compass(a.bearingFromMe);
      a.approachRunway = approachRunway(a.track);
      a.onApproach = isOnApproach(a);
    }
  }

  function refreshMarker(a) {
    if (!Number.isFinite(a.lat) || !Number.isFinite(a.lon)) return;
    const stale = (Date.now() - a.lastUpdate) > 30_000;
    const icon = makeIcon(a.callsign, a.track, a.onApproach, stale);
    if (!a.marker) {
      a.marker = L.marker([a.lat, a.lon], { icon }).addTo(map);
      a.marker.bindPopup(() => popupHtml(a));
    } else {
      a.marker.setLatLng([a.lat, a.lon]);
      a.marker.setIcon(icon);
      if (a.marker.isPopupOpen()) a.marker.getPopup().setContent(popupHtml(a));
    }
    refreshVector(a);
  }

  function popupHtml(a) {
    const knots = a.gs_mps != null ? (a.gs_mps * 1.94384).toFixed(0) + " kt" : "—";
    const vr_fpm = a.vr_mps != null ? Math.round(a.vr_mps * 196.85) : null;
    const vr = vr_fpm != null ? (vr_fpm >= 0 ? `+${vr_fpm}` : vr_fpm) + " fpm" : "—";
    const trk = Number.isFinite(a.track) ? `${a.track.toFixed(0)}°` : "—";
    const alt = a.alt_ft != null ? `${a.alt_ft.toLocaleString()} ft${a.alt_source ? ` (${a.alt_source})` : ""}` : "—";
    const distApt = Number.isFinite(a.distApt) ? `${a.distApt.toFixed(1)} nm` : "—";
    const distMe = Number.isFinite(a.distMe) ? `${a.distMe.toFixed(1)} nm ${a.compassFromMe}` : "—";
    const cs = a.callsign ? `<b>${escapeHtml(a.callsign)}</b>` : "<i>no callsign</i>";
    const tag = a.approachRunway ? `<span style="color:#4ade80">→ ${a.approachRunway}</span>` : "";
    return `<div><b>${escapeHtml(a.icao)}</b> &mdash; ${cs} ${tag}</div>
      <table>
        <tr><td>altitude</td><td>${alt}</td></tr>
        <tr><td>track / speed</td><td>${trk} / ${knots}</td></tr>
        <tr><td>v/s</td><td>${vr}</td></tr>
        <tr><td>from ${escapeHtml(AIRPORT.name)}</td><td>${distApt}</td></tr>
        <tr><td>from you</td><td>${distMe}</td></tr>
      </table>`;
  }

  // --- Panel UI --------------------------------------------------------------

  const statusEl = document.getElementById("status");
  const trackedEl = document.getElementById("tracked");
  const lowNearEl = document.getElementById("low-near");
  const approachCountEl = document.getElementById("approach-count");
  const runwayGuessEl = document.getElementById("runway-guess");
  const aircraftList = document.getElementById("aircraft");

  // Stat: distance from user to airport (one-shot, immutable).
  document.getElementById("airport-stats").textContent =
    `${AIRPORT_REF[0].toFixed(4)}, ${AIRPORT_REF[1].toFixed(4)} · ${haversineNm(ME, AIRPORT_REF).toFixed(1)} nm · ${compass(bearingDeg(ME, AIRPORT_REF))}`;
  document.getElementById("you").textContent = `${ME[0].toFixed(4)}, ${ME[1].toFixed(4)}`;

  function setStatus(text, cls) {
    statusEl.className = cls;
    statusEl.textContent = text;
  }

  function renderPanel() {
    let tracked = 0, lowNear = 0, approaching = 0;
    const runwayVotes = Object.create(null);
    const onApproach = [];
    const nearby = [];

    for (const a of aircraft.values()) {
      tracked++;
      if (!Number.isFinite(a.distApt)) continue;
      if (a.distApt <= MAX_RANGE_NM && a.alt_ft != null && a.alt_ft <= MAX_APPROACH_ALT) {
        lowNear++;
        nearby.push(a);
      }
      if (a.onApproach) {
        approaching++;
        onApproach.push(a);
        runwayVotes[a.approachRunway] = (runwayVotes[a.approachRunway] || 0) + 1;
      }
    }
    trackedEl.textContent = tracked;
    lowNearEl.textContent = lowNear;
    approachCountEl.textContent = approaching;

    // Active runway guess: the runway with the most current approachers.
    let best = null;
    for (const [r, n] of Object.entries(runwayVotes)) {
      if (!best || n > best.n) best = { r, n };
    }
    runwayGuessEl.textContent = best ? `${best.r} (${best.n} aircraft on final)` : "—";

    // List: approachers first, then nearby low aircraft, by distance from user.
    const visible = onApproach.slice();
    for (const a of nearby) if (!visible.includes(a)) visible.push(a);
    visible.sort((x, y) => (x.distMe ?? 999) - (y.distMe ?? 999));

    aircraftList.innerHTML = visible.slice(0, 16).map(a => {
      const cs = a.callsign ? escapeHtml(a.callsign) : "<i style='color:#8b939c'>—</i>";
      const tag = a.onApproach
        ? `<span class="approach-tag">→ rwy ${a.approachRunway}</span>`
        : `<span class="approach-tag unknown">nearby</span>`;
      const alt = a.alt_ft != null ? `${a.alt_ft.toLocaleString()} ft` : "—";
      const dist = Number.isFinite(a.distMe) ? `${a.distMe.toFixed(1)} nm ${a.compassFromMe}` : "—";
      const trk = Number.isFinite(a.track) ? `${a.track.toFixed(0)}°` : "";
      return `<li data-icao="${escapeHtml(a.icao)}">
        <div class="row1"><span><span class="callsign">${cs}</span> <span class="icao">${escapeHtml(a.icao)}</span></span>${tag}</div>
        <div class="row2">${alt} · ${dist} · trk ${trk}</div>
      </li>`;
    }).join("");
  }

  aircraftList.addEventListener("click", e => {
    const li = e.target.closest("li[data-icao]");
    if (!li) return;
    const a = aircraft.get(li.dataset.icao);
    if (a && a.marker) {
      map.setView([a.lat, a.lon], Math.max(map.getZoom(), 12));
      a.marker.openPopup();
    }
  });

  // --- Seed + subscribe -------------------------------------------------------

  // Bound the SSE subscription to the chosen airport's approach
  // corridor. Saves both bandwidth and JS work on the client.
  const STREAM_URL = `/stream?bbox=${encodeURIComponent(AIRPORT.bbox)}&alt_max=${MAX_APPROACH_ALT + 2000}`;

  async function seedFromSnapshot() {
    try {
      const r = await fetch("/aircraft");
      if (!r.ok) return;
      const list = await r.json();
      for (const s of list) {
        if (!s.position) continue;
        const a = ensureAircraft(s.icao);
        a.callsign = s.callsign || a.callsign;
        a.lat = s.position.lat;
        a.lon = s.position.lon;
        if (s.position.alt_ft != null) a.alt_ft = s.position.alt_ft;
        if (s.position.alt_source != null) a.alt_source = s.position.alt_source;
        if (s.velocity) {
          a.track = s.velocity.track_deg ?? s.velocity.heading_deg ?? a.track;
          a.gs_mps = s.velocity.gs_mps ?? a.gs_mps;
          a.vr_mps = s.velocity.vr_mps ?? a.vr_mps;
        }
        recompute(a);
        if (Number.isFinite(a.distApt) && a.distApt <= MAX_RANGE_NM + 5) {
          refreshMarker(a);
        }
      }
      renderPanel();
    } catch {}
  }

  function openStream() {
    setStatus("connecting…", "wait");
    const es = new EventSource(STREAM_URL);
    es.addEventListener("open", () => setStatus("connected", "ok"));
    es.addEventListener("error", () => setStatus("disconnected — reconnecting…", "bad"));

    es.addEventListener("identification", e => {
      const d = JSON.parse(e.data);
      const a = ensureAircraft(d.icao);
      a.callsign = d.callsign;
      a.lastUpdate = Date.now();
      refreshMarker(a);
      renderPanel();
    });
    es.addEventListener("position", e => {
      const d = JSON.parse(e.data);
      const a = ensureAircraft(d.icao);
      a.lat = d.lat; a.lon = d.lon;
      if (d.alt_ft != null) a.alt_ft = d.alt_ft;
      if (d.alt_source != null) a.alt_source = d.alt_source;
      a.lastUpdate = Date.now();
      recompute(a);
      refreshMarker(a);
      renderPanel();
    });
    es.addEventListener("velocity", e => {
      const d = JSON.parse(e.data);
      const a = ensureAircraft(d.icao);
      if (d.track_deg != null) a.track = d.track_deg;
      else if (d.heading_deg != null) a.track = d.heading_deg;
      if (d.gs_mps != null) a.gs_mps = d.gs_mps;
      if (d.vr_mps != null) a.vr_mps = d.vr_mps;
      a.lastUpdate = Date.now();
      recompute(a);
      refreshMarker(a);
      renderPanel();
    });
    es.addEventListener("lost", e => {
      const d = JSON.parse(e.data);
      const a = aircraft.get(d.icao);
      if (a) {
        if (a.marker) map.removeLayer(a.marker);
        if (a.vector) map.removeLayer(a.vector);
      }
      aircraft.delete(d.icao);
      renderPanel();
    });
  }

  // Periodically refresh stale tags so marker colour decays even
  // when no events have come in.
  setInterval(() => {
    for (const a of aircraft.values()) refreshMarker(a);
    renderPanel();
  }, 10_000);

  // Vector slider wiring: re-renders every aircraft's projection
  // line on every input event (cheap — bounded by visible aircraft).
  // The URL is updated lazily on `change` so reloads remember the
  // user's preference without spamming history entries during drag.
  const vecSlider = document.getElementById("vec-slider");
  const vecValue = document.getElementById("vec-value");
  vecSlider.value = String(VECTOR_SECONDS);
  vecValue.textContent = String(VECTOR_SECONDS);
  vecSlider.addEventListener("input", () => {
    VECTOR_SECONDS = parseInt(vecSlider.value, 10);
    vecValue.textContent = String(VECTOR_SECONDS);
    for (const a of aircraft.values()) refreshVector(a);
  });
  vecSlider.addEventListener("change", () => {
    const url = new URL(location.href);
    if (VECTOR_SECONDS === 60) url.searchParams.delete("vec");
    else url.searchParams.set("vec", String(VECTOR_SECONDS));
    history.replaceState(null, "", url.toString());
  });

  seedFromSnapshot();
  openStream();
  </script>
</body>
</html>
